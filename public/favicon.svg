<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Background -->
  <rect width="32" height="32" rx="7" fill="#15803d"/>

  <!-- Pitch surface (lighter green) -->
  <rect x="3" y="4" width="26" height="24" rx="2" fill="#16a34a"/>

  <!-- Pitch border -->
  <rect x="3" y="4" width="26" height="24" rx="2" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="1.2"/>

  <!-- Halfway line -->
  <line x1="3" y1="16" x2="29" y2="16" stroke="rgba(255,255,255,0.7)" stroke-width="1.2"/>

  <!-- Center circle -->
  <circle cx="16" cy="16" r="4.5" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="1.2"/>

  <!-- Center spot -->
  <circle cx="16" cy="16" r="1" fill="rgba(255,255,255,0.9)"/>

  <!-- Left penalty box -->
  <rect x="3" y="10" width="6" height="12" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="1.2"/>

  <!-- Right penalty box -->
  <rect x="23" y="10" width="6" height="12" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="1.2"/>

  <!-- Left goal -->
  <rect x="3" y="13" width="2.5" height="6" fill="none" stroke="rgba(255,255,255,0.9)" stroke-width="1.2"/>

  <!-- Right goal -->
  <rect x="26.5" y="13" width="2.5" height="6" fill="none" stroke="rgba(255,255,255,0.9)" stroke-width="1.2"/>
</svg>
